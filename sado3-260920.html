<style>
:root{--bg:#FCF3EB;--ink:#2E2A26;--navy:#14497B;--mid:#6E9FCB;--line:#E4D9CC}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--bg);color:var(--ink);
 font-family:"Nanum Myeongjo","Noto Serif KR","AppleSDGothicNeo-Regular","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",serif;
 display:flex;flex-direction:column;user-select:none}
#mark{position:fixed;left:50%;top:50%;width:62vmin;pointer-events:none;z-index:0;
 opacity:.07;transition:transform 1.2s ease,opacity 1.2s ease}
header{position:relative;z-index:2;padding:calc(18px + env(safe-area-inset-top)) 20px 10px;text-align:center;flex:none}
.title{font-size:clamp(17px,4.2vw,24px);color:var(--navy);font-weight:700;letter-spacing:-.3px}
.sub{font-size:clamp(13px,3.2vw,17px);color:var(--mid);margin-top:6px}
#bar{height:8px;background:var(--line);border-radius:99px;margin:14px auto 0;max-width:760px;overflow:hidden}
#fill{height:100%;width:0;background:var(--navy);border-radius:99px;transition:width .4s ease}
main{position:relative;z-index:1;flex:1;display:block;padding:14px 22px 24px;
 overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.wrap{max-width:820px;margin:0 auto;width:100%}
.qno{font-size:clamp(14px,3.4vw,18px);color:var(--mid);margin-bottom:10px;font-weight:700}
.qtext{font-size:clamp(16px,4.1vw,27px);line-height:1.65;font-weight:700;
 word-break:keep-all;overflow-wrap:break-word;letter-spacing:-.01em;
 text-align:left}
ol{list-style:none;padding:0;margin:22px 0 0}
li{font-size:clamp(15px,3.55vw,22px);line-height:1.55;padding:13px 16px;margin-bottom:10px;
 border:2px solid var(--line);border-radius:16px;background:rgba(255,255,255,.55);
 display:flex;gap:14px;align-items:flex-start;word-break:keep-all;cursor:pointer;
 transition:border-color .15s,background .15s}
li.pick{border-color:var(--navy);background:rgba(20,73,123,.09)}
.num{color:var(--mid);font-weight:700;flex:none}
li>span:last-child{flex:1;text-align:left;word-break:keep-all}
.fillq{font-size:clamp(16px,4.0vw,26px);line-height:2.2;font-weight:700;overflow-wrap:break-word;
 word-break:keep-all;overflow-wrap:break-word}
.fillq .gap{display:inline-block;min-width:4.2em;max-width:100%;font-family:inherit;
 font-size:inherit;font-weight:700;line-height:1.3;text-align:center;color:var(--navy);
 border:none;border-bottom:3px solid var(--mid);background:transparent;outline:none;
 padding:0 .25em;margin:0 .15em;vertical-align:baseline}
.fillq .gap:focus{border-bottom-color:var(--navy);background:rgba(20,73,123,.06)}
.ansbox{margin-top:22px}
.ansbox label{display:block;font-size:clamp(14px,3.4vw,18px);color:var(--mid);margin-bottom:8px;font-weight:700}
textarea{width:100%;min-height:130px;font-family:inherit;font-size:clamp(15px,3.6vw,21px);
 line-height:1.6;padding:14px 16px;border:2px solid var(--line);border-radius:16px;
 background:rgba(255,255,255,.72);color:var(--ink);resize:vertical;outline:none}
textarea:focus{border-color:var(--navy)}
#author{position:relative;z-index:2;flex:none;text-align:center;margin:10px auto 0;
 font-size:clamp(13px,3.2vw,17px);color:var(--mid);font-weight:700;letter-spacing:-.01em}
#who{position:relative;z-index:2;flex:none;display:flex;gap:18px;max-width:560px;margin:8px auto 0;
 width:100%;padding:0 22px}
#who div{flex:1 1 0;min-width:0;display:flex;align-items:baseline;gap:7px}
#who span{font-size:clamp(13px,3.2vw,17px);color:var(--mid);font-weight:700;flex:none}
#who input{flex:1 1 0;width:100%;min-width:0;font-family:inherit;font-size:clamp(15px,3.8vw,20px);
 text-align:center;padding:7px 6px;border:none;border-bottom:2px solid var(--line);background:transparent;
 color:var(--ink);outline:none}
#who input:focus{border-bottom-color:var(--navy)}
nav{position:relative;z-index:2;flex:none;display:flex;gap:12px;padding:14px 20px calc(18px + env(safe-area-inset-bottom));
 max-width:860px;margin:0 auto;width:100%}
button{flex:1;font-family:inherit;font-size:clamp(20px,5vw,26px);font-weight:700;padding:20px 10px;
 border-radius:18px;border:2px solid var(--navy);background:#fff;color:var(--navy);cursor:pointer}
button.main{background:var(--navy);color:#fff}
button:disabled{opacity:.32;cursor:default}
#snd{position:fixed;right:14px;top:14px;z-index:5;width:52px;height:52px;padding:0;flex:none;
 border-radius:50%;font-size:22px;line-height:1;border:2px solid var(--line);background:rgba(255,255,255,.8);color:var(--mid)}
#end{text-align:center}
#end .big{font-size:clamp(26px,6.6vw,40px);font-weight:700;color:var(--navy);line-height:1.6}
#end .small{font-size:clamp(17px,4.2vw,22px);color:var(--mid);margin-top:22px;line-height:1.8}
#end .acts{display:flex;flex-direction:column;gap:12px;margin-top:28px}
#end .acts2{display:flex;gap:10px;margin-top:22px}
#end .acts2 button{flex:1;font-size:clamp(15px,3.6vw,19px);padding:13px 6px;opacity:.85}
#imgbox{margin-top:20px}
#imgbox img{width:100%;max-width:560px;display:block;margin:0 auto;border-radius:14px;
 box-shadow:0 2px 14px rgba(20,73,123,.12);border:1px solid var(--line);-webkit-touch-callout:default}
#hint b{color:var(--navy)}
#end .acts button{width:100%;flex:none;font-size:clamp(19px,4.8vw,25px);padding:19px 10px}
#hint{font-size:clamp(14px,3.5vw,18px);color:var(--mid);margin-top:18px;line-height:1.7}
#toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%);z-index:9;
 background:var(--navy);color:#fff;padding:14px 26px;border-radius:99px;
 font-size:clamp(16px,4vw,20px);opacity:0;pointer-events:none;transition:opacity .3s}
#toast.on{opacity:1}

  "q": "유두고가 삼층에서 떨어진 것은|어떤 의미가 있습니까?",
  "o": [
   "예배 중에 졸면 안된다.",
   "설교를 길게 하면 안된다.",
   "이 일을 통해 하나님이 하시는 일을|나타내기 위함이다.",
   "자리에 걸터 앉으면 안된다."
  ]
 },
 {
  "n": "5",
  "q": "그 주간의 첫날은 오늘날 무슨 날입니까?",
  "o": [
   "안식일",
   "금요일",
   "토요일",
   "주일"
  ]
 },
 {
  "n": "주관식 1",
  "q": "유두고의 이름의 뜻은 무엇입니까?",
  "o": []
 },
 {
  "n": "주관식 2",
  "q": "바울이 에베소를 떠나 마게도냐를 거쳐|헬라에 이르러 석 달 동안 있으면서|무엇을 했습니까? (20:3)",
  "o": []
 },
 {
  "n": "주관식 3",
  "q": "예수를 죽은 자 가운데서 살리신 이의 §이 너희 안에 거하시면|그리스도 예수를 죽은 자 가운데서 살리신 이가|너희 안에 거하시는 그의 §으로 말미암아|너희 죽을 §도 살리시리라. (롬 8:11)",
  "o": [],
  "fill": true
 }
];
let i=0, picks={}, texts={}, gaps={}, audioOn=false, ctx=null, timer=null;

function br(t){ return String(t).split('|').join('<br>'); }
const stage=document.getElementById('stage'), mark=document.getElementById('mark');
const prog=document.getElementById('prog'), fill=document.getElementById('fill');

function markStyle(k){
  const rot=[-8,6,-3,10,-12,4,-6,9][k%8];
  const sc =[1,1.12,.92,1.2,1.05,.88,1.15,.98][k%8];
  const dx =[-50,-56,-44,-52,-48,-58,-42,-50][k%8];
  const dy =[-50,-46,-54,-50,-58,-48,-44,-52][k%8];
  mark.style.transform='translate('+dx+'%,'+dy+'%) rotate('+rot+'deg) scale('+sc+')';
  mark.style.opacity=(0.055+0.03*((k%4)/3)).toFixed(3);
}

function draw(){
  if(i>=Q.length){
    prog.textContent='다 푸셨습니다';
    fill.style.width='100%';
    const g=document.getElementById('grp').value.trim(), nmv=document.getElementById('nm').value.trim();
    const who = (g||nmv) ? (g?g+' ':'')+(nmv?nmv+'님, ':'') : '';
    stage.innerHTML='<div id="end"><div class="big">'+who+'<br>여덟 문제를 모두 마치셨습니다</div>'+
      '<div class="small">정답은 글로바를 통해<br>토요일 오전에 카톡으로 발송합니다.</div>'+
      '<div class="acts">'+
      '<button class="main" id="show">답 확인하기</button>'+
      '</div>'+
      '<div id="imgbox"></div>'+
      '<div id="hint">답 확인 후 이미지를 <b>길게 누르면</b><br>"이미지 저장" 메뉴가 나타납니다.<br>'+
      '<span style="opacity:.75">(카톡에서 사진 저장하는 방법과 동일)</span></div>'+
      '<div class="acts2">'+
      '<button id="send">카카오톡으로 보내기</button>'+
      '<button id="copy">글로 복사하기</button>'+
      '</div></div>';
    bindActions();
    document.getElementById('next').textContent='처음부터';
    markStyle(0); return;
  }
  const q=Q[i];
  prog.textContent=(i+1)+' / '+Q.length;
  fill.style.width=((i+1)/Q.length*100)+'%';
  let h='<div class="qno">'+(/^[0-9]+$/.test(q.n)?q.n+'번':q.n)+'</div>';
  if(q.fill){
    const parts=q.q.split('§');
    let f='<div class="fillq">';
    parts.forEach(function(seg,j){
      f+=br(seg);
      if(j<parts.length-1) f+='<input class="gap" data-g="'+j+'" type="text" autocomplete="off">';
    });
    h+=f+'</div>';
    stage.innerHTML=h;
    stage.querySelectorAll('.gap').forEach(function(el){
      const key=i+'_'+el.dataset.g;
      el.value=gaps[key]||'';
      const grow=function(){
        const t=el.value||'';
        el.style.width=Math.max(4.2, t.length*1.05+1.4)+'em';
      };
      grow();
      el.addEventListener('input',function(){ gaps[key]=el.value; grow(); });
    });
    document.getElementById('next').textContent=(i===Q.length-1)?'마치기':'다음';
    document.getElementById('prev').disabled=(i===0);
    markStyle(i);
    document.querySelector('main').scrollTop=0;
    return;
  }
  h+='<div class="qtext">'+br(q.q)+'</div>';
  if(q.o.length){
    h+='<ol>';
    q.o.forEach(function(t,j){
      const on=picks[i]===j?' pick':'';
      h+='<li class="'+on+'" data-j="'+j+'"><span class="num">'+(j+1)+'</span><span>'+br(t)+'</span></li>';
    });
    h+='</ol>';
  }else{
    if(q.two){
      h+='<div class="ansbox"><label>① 첫 번째</label>'+
         '<textarea id="ta" rows="3"></textarea></div>'+
         '<div class="ansbox"><label>② 두 번째</label>'+
         '<textarea id="ta2" rows="3"></textarea></div>';
    }else{
      h+='<div class="ansbox"><label>답을 적어 보세요</label>'+
         '<textarea id="ta" rows="4" placeholder=""></textarea></div>';
    }
  }
  stage.innerHTML=h;
  const ta=document.getElementById('ta');
  if(ta){
    ta.value = texts[i] || '';
    ta.addEventListener('input',function(){ texts[i]=ta.value; });
  }
  const ta2=document.getElementById('ta2');
  if(ta2){
    ta2.value = texts[i+'_b'] || '';
    ta2.addEventListener('input',function(){ texts[i+'_b']=ta2.value; });
  }
  stage.querySelectorAll('li').forEach(function(el){
    el.onclick=function(){
      const j=+el.dataset.j;
      picks[i] = (picks[i]===j) ? undefined : j;
      draw();
    };
  });
  document.getElementById('next').textContent = (i===Q.length-1)?'마치기':'다음';
  document.getElementById('prev').disabled = (i===0);
  markStyle(i);
  document.querySelector('main').scrollTop=0;
}

function buildAnswer(){
  const g=document.getElementById('grp').value.trim(), nmv=document.getElementById('nm').value.trim();
  let L=['성경공부 · 사도행전 3'];
  L.push('공동체: '+(g||'-')+'   이름: '+(nmv||'-'));
  L.push('');
  Q.forEach(function(q,k){
    let a;
    if(q.fill){
      const n=q.q.split('§').length-1; let arr=[];
      for(let j=0;j<n;j++) arr.push(gaps[k+'_'+j]||'( )');
      a=arr.join(' / ');
    }else if(q.o.length){
      a = (picks[k]===undefined) ? '(무응답)' : (picks[k]+1)+'번 '+q.o[picks[k]];
    }else{
      if(q.two){
        const a1=(texts[k]||'').trim()||'( )', a2=(texts[k+'_b']||'').trim()||'( )';
        a='① '+a1+'  ② '+a2;
      }else{
        a = (texts[k]||'').trim() || '(무응답)';
      }
    }
    L.push((/^[0-9]+$/.test(q.n)?q.n+'.':q.n+' ·')+' '+a);
  });
  return L.join(String.fromCharCode(10));
}
function makeImage(cb){
  const g=document.getElementById('grp').value.trim(), nmv=document.getElementById('nm').value.trim();
  const W=1000, PAD=54, LH=52;
  const rows=[];
  Q.forEach(function(q,k){
    let a;
    if(q.fill){
      const n=q.q.split('§').length-1; let arr=[];
      for(let j=0;j<n;j++) arr.push(gaps[k+'_'+j]||'( )');
      a=arr.join('  /  ');
    }else if(q.o.length){
      a=(picks[k]===undefined)?'(무응답)':(picks[k]+1)+'번  '+q.o[picks[k]].split('|').join(' ');
    }else{
      if(q.two){
        a='① '+((texts[k]||'').trim()||'( )')+'   ② '+((texts[k+'_b']||'').trim()||'( )');
      }else{
        a=(texts[k]||'').trim()||'(무응답)';
      }
    }
    rows.push([(/^[0-9]+$/.test(q.n)?q.n+'.':q.n), a]);
  });
  const c=document.createElement('canvas'), x=c.getContext('2d');
  const F='700 30px "Nanum Myeongjo","Noto Serif KR","Apple SD Gothic Neo","Malgun Gothic",serif';
  x.font=F;
  const maxW=W-PAD*2-72;
  const wrapped=rows.map(function(r){
    const words=String(r[1]).split(' ');
    let lines=[], cur='';
    words.forEach(function(w){
      const t=cur?cur+' '+w:w;
      if(x.measureText(t).width>maxW){ if(cur)lines.push(cur); cur=w; } else cur=t;
    });
    if(cur)lines.push(cur);
    return [r[0], lines];
  });
  let H=PAD*2+150;
  wrapped.forEach(function(r){ H+=r[1].length*LH+16; });
  c.width=W; c.height=H;
  x.fillStyle='#FCF3EB'; x.fillRect(0,0,W,H);
  x.fillStyle='#14497B';
  x.font='700 38px "Nanum Myeongjo","Noto Serif KR","Malgun Gothic",serif';
  x.fillText('성경공부 · 사도행전 3', PAD, PAD+42);
  x.fillStyle='#6E9FCB'; x.font='700 28px "Nanum Myeongjo","Malgun Gothic",serif';
  x.fillText('공동체  '+(g||'-')+'      이름  '+(nmv||'-'), PAD, PAD+94);
  x.strokeStyle='#E4D9CC'; x.lineWidth=3;
  x.beginPath(); x.moveTo(PAD,PAD+124); x.lineTo(W-PAD,PAD+124); x.stroke();
  let y=PAD+178;
  wrapped.forEach(function(r){
    x.fillStyle='#6E9FCB'; x.font='700 30px "Nanum Myeongjo","Malgun Gothic",serif';
    x.fillText(r[0], PAD, y);
    x.fillStyle='#2E2A26'; x.font=F;
    r[1].forEach(function(ln,j){ x.fillText(ln, PAD+72, y+j*LH); });
    y+=r[1].length*LH+16;
  });
  c.toBlob(function(b){ cb(b, '사도행전1_'+(nmv||'답안')+'.png'); }, 'image/png');
}
function toast(msg){
  let el=document.getElementById('toast');
  if(!el){ el=document.createElement('div'); el.id='toast'; document.body.appendChild(el); }
  el.textContent=msg; el.classList.add('on');
  setTimeout(function(){ el.classList.remove('on'); },1900);
}
function bindActions(){
  const show=document.getElementById('show');
  const box=document.getElementById('imgbox');
  let blobUrl=null;
  show.onclick=function(){
    show.textContent='만드는 중…'; show.disabled=true;
    makeImage(function(blob,name){
      if(blobUrl) URL.revokeObjectURL(blobUrl);
      blobUrl=URL.createObjectURL(blob);
      box.innerHTML='<img src="'+blobUrl+'" alt="답안">';
      show.textContent='답 확인하기'; show.disabled=false;
      show.style.display='none';
      setTimeout(function(){ box.scrollIntoView({behavior:'smooth',block:'start'}); },80);
    });
  };
  document.getElementById('send').onclick=function(){
    const btn=this; btn.textContent='만드는 중…';
    makeImage(function(blob,name){
      btn.textContent='카카오톡으로 보내기';
      const file=new File([blob],name,{type:'image/png'});
      if(navigator.canShare&&navigator.canShare({files:[file]})){
        navigator.share({files:[file], title:'성경공부 답안'}).catch(function(){});
      }else{
        toast('공유가 막힌 환경입니다. 위 이미지를 길게 눌러 저장하세요');
      }
    });
  };
  document.getElementById('copy').onclick=function(){ copyText(buildAnswer()); toast('답안을 복사했습니다'); };
}
function copyText(t){
  if(navigator.clipboard&&window.isSecureContext){ navigator.clipboard.writeText(t); return; }
  const ta=document.createElement('textarea'); ta.value=t;
  ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); }catch(e){}
  ta.remove();
}
document.getElementById('next').onclick=function(){
  if(i>=Q.length){ i=0; picks={}; texts={}; gaps={}; document.getElementById('grp').value='';document.getElementById('nm').value=''; } else { i++; }
  draw();
};
document.getElementById('prev').onclick=function(){ if(i>0){i--;draw();} };

/* ── 밝고 편안한 배경음 (브라우저에서 직접 생성) ── */
const MAJ=[0,2,4,7,9,12,16,19,21,24];        /* 장조 5음계 */
let step=0;
function ping(freq,t,dur,gain,type){
  const o=ctx.createOscillator(), g=ctx.createGain();
  o.type=type||'triangle'; o.frequency.value=freq;
  g.gain.setValueAtTime(0,t);
  g.gain.linearRampToValueAtTime(gain,t+0.02);          /* 빠른 어택 */
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);    /* 종처럼 감쇠 */
  o.connect(g); g.connect(master);
  o.start(t); o.stop(t+dur+0.05);
}
function phrase(){
  const t=ctx.currentTime+0.05;
  const root=392.00;                                    /* G4 - 밝은 음역 */
  const beat=0.42;
  const shape=[[0,0],[1,2],[2,4],[3,3],[4,5],[5,4]];    /* 오르내리는 음형 */
  shape.forEach(function(p){
    const idx=(step+p[1])%MAJ.length;
    ping(root*Math.pow(2,MAJ[idx]/12), t+p[0]*beat, 1.5, 0.055);
  });
  ping(root/2*Math.pow(2,MAJ[step%5]/12), t, 2.6, 0.03, 'sine');   /* 낮은 받침 */
  step=(step+2)%MAJ.length;
}
let master=null;
function startAudio(){
  if(!ctx){
    ctx=new (window.AudioContext||window.webkitAudioContext)();
    master=ctx.createGain(); master.gain.value=0.9;
    const rev=ctx.createBiquadFilter(); rev.type='highshelf';
    rev.frequency.value=2600; rev.gain.value=-6;
    master.connect(rev); rev.connect(ctx.destination);
  }
  if(ctx.state==='suspended') ctx.resume();
  phrase(); timer=setInterval(phrase,2900);
}
function stopAudio(){ clearInterval(timer); timer=null; if(ctx) ctx.suspend(); }
document.getElementById('snd').onclick=function(){
  audioOn=!audioOn;
  this.textContent=audioOn?'♪':'✕';
  this.style.color=audioOn?'#14497B':'#6E9FCB';
  audioOn?startAudio():stopAudio();
};

document.addEventListener('keydown',function(e){
  const t=e.target.tagName;
  if(t==='TEXTAREA'||t==='INPUT') return;
  if(e.key==='ArrowRight'||e.key===' ') document.getElementById('next').click();
  if(e.key==='ArrowLeft') document.getElementById('prev').click();
});
draw();
</script></body></html>
