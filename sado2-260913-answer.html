:root{--bg:#FCF3EB;--ink:#2E2A26;--navy:#14497B;--mid:#6E9FCB;--line:#E4D9CC;--ok:#1C6B4A}

html,body{margin:0;height:100%;overflow:hidden}

.wrap{max-width:820px;margin:0 auto;width:100%}
.qno{font-size:clamp(14px,3.4vw,18px);color:var(--mid);margin-bottom:10px;font-weight:700}

ol{list-style:none;padding:0;margin:22px 0 0}

 display:flex;gap:12px;align-items:flex-start;word-break:keep-all}
li.ok{border-color:var(--ok);background:rgba(28,107,74,.10)}
.num{color:var(--mid);font-weight:700;flex:none}
li.ok .num{color:var(--ok)}
li>span:last-child{flex:1;text-align:left;word-break:keep-all}
.chk{flex:none;color:var(--ok);font-weight:700}
.ans{margin-top:22px;border-left:5px solid var(--ok);padding:4px 0 4px 16px}
.ans .lab{font-size:clamp(13px,3.2vw,17px);color:var(--ok);font-weight:700;margin-bottom:8px}
.ans .txt{font-size:clamp(16px,4.1vw,27px);line-height:1.7;word-break:keep-all}
.blankq{font-size:clamp(16px,4.0vw,26px);line-height:2.15;font-weight:700;
 word-break:keep-all;overflow-wrap:break-word}
.blankq b{display:inline-block;color:var(--ok);border-bottom:3px solid var(--ok);
 padding:0 .3em;font-weight:700;white-space:nowrap}
nav{position:relative;z-index:2;flex:none;display:flex;gap:12px;padding:14px 20px calc(18px + env(safe-area-inset-bottom));

button{flex:1;font-family:inherit;font-size:clamp(19px,4.8vw,25px);font-weight:700;padding:19px 10px;

button.main{background:var(--navy);color:#fff}
button:disabled{opacity:.32;cursor:default}

#end .big{font-size:clamp(24px,6vw,38px);font-weight:700;color:var(--navy);line-height:1.6}
