<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="엠마오교회 가족초청주일(2026년 11월 15일) 초청 대상자. 함께 오실 분의 이름을 적어 공동체 리더에게 보내주세요.">
<meta name="theme-color" content="#FCF2E6">
<meta name="color-scheme" content="light">
<meta property="og:type" content="website">
<meta property="og:title" content="가족초청주일 · 초청 대상자">
<meta property="og:description" content="함께 오실 분의 이름을 적어 10월 30일까지 보내주세요.">
<meta property="og:url" content="https://emmaus-warm-lords-arms.github.io/invite-261115">
<meta property="og:image" content="https://emmaus-warm-lords-arms.github.io/og-invite.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://emmaus-warm-lords-arms.github.io/og-invite.jpg">
<title>가족초청주일 · 초청 대상자</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#FCF2E6;--card:#FFFDF9;--ink:#2E2A26;--navy:#14497B;--mid:#6E9FCB;--sub:#5B5148;
 --line:#E4D9CC;--acc:#B5612A;--mint:#9ED6C4}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);word-break:keep-all;
 font-family:"Nanum Myeongjo","Noto Serif KR","AppleSDGothicNeo-Regular","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",serif;
 padding:calc(26px + env(safe-area-inset-top)) 16px calc(40px + env(safe-area-inset-bottom))}
.wrap{max-width:560px;margin:0 auto}

/* 앞표지 */
.cover{text-align:center}
.kicker{font-size:clamp(13px,3.4vw,16px);font-weight:700;letter-spacing:.3em;color:var(--acc);margin-left:.3em}
h1{margin:8px 0 0;font-size:clamp(40px,11.5vw,58px);font-weight:800;line-height:1.1;color:var(--navy);letter-spacing:-.01em}
.date{display:flex;justify-content:center;align-items:center;gap:8px;margin-top:10px}
.date b{font-size:clamp(24px,6.6vw,32px);font-weight:800;color:var(--acc)}
.date span{font-size:clamp(14px,3.6vw,17px);font-weight:700;color:#fff;background:var(--acc);border-radius:99px;padding:3px 11px}
.art{display:block;width:100%;height:auto;max-width:520px;aspect-ratio:1/1;margin:6px auto 0;
 -webkit-touch-callout:none;pointer-events:none}

/* 신청 카드: 그림 아래쪽에 겹쳐 올림 */
.card{position:relative;margin:-84px 4px 0;background:rgba(255,253,249,.95);
 border:1px solid var(--line);border-radius:24px;padding:26px 20px 24px;
 box-shadow:0 10px 30px -18px rgba(20,73,123,.45)}
.lead{text-align:center;font-size:clamp(19px,5vw,23px);font-weight:800;line-height:1.5;color:var(--navy);margin:0 0 22px}
.field{display:block;margin-bottom:16px}
.field .lab,.who-lab{display:block;font-size:clamp(15px,3.9vw,18px);font-weight:800;color:var(--sub);margin-bottom:7px}
input[type=text]{width:100%;font-family:inherit;font-size:clamp(19px,5vw,22px);font-weight:700;color:var(--ink);
 padding:13px 14px;border:2px solid var(--line);border-radius:14px;background:#fff;outline:none;
 -webkit-appearance:none;appearance:none}
input[type=text]:focus{border-color:var(--navy);box-shadow:0 0 0 3px rgba(20,73,123,.12)}
input::placeholder{color:#B9AC9C;font-weight:400}
.pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.rule{height:1px;background:var(--line);margin:8px 0 20px}
.who-lab small{font-weight:700;color:var(--mid);font-size:.85em;margin-left:4px}
.guest{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.guest .no{flex:none;width:34px;height:34px;border-radius:50%;background:var(--mint);color:var(--navy);
 font-weight:800;font-size:17px;display:flex;align-items:center;justify-content:center;font-family:"Noto Sans KR",system-ui,sans-serif}
.more{width:100%;margin-top:4px;font-family:inherit;font-size:clamp(17px,4.4vw,20px);font-weight:800;color:var(--navy);
 padding:13px 10px;border:2px dashed var(--mid);border-radius:14px;background:transparent;cursor:pointer}
.more:active{background:rgba(110,159,203,.10)}
.due{margin:24px 0 0;text-align:center;font-size:clamp(16px,4.2vw,19px);line-height:1.6;color:var(--sub);
 padding:14px 12px;border-radius:14px;background:#F7EBDD}
.due b{color:var(--acc);font-size:1.12em}
.go{width:100%;margin-top:18px;font-family:inherit;font-size:clamp(21px,5.6vw,26px);font-weight:800;
 padding:19px 10px;border-radius:18px;border:none;background:var(--navy);color:#fff;cursor:pointer}
.go:disabled{opacity:.5}

/* 만들어진 신청서 */
#result{display:none;margin-top:26px;text-align:center}
#result.on{display:block}
#result .done{font-size:clamp(20px,5.2vw,24px);font-weight:800;color:var(--navy);line-height:1.5}
#result img{display:block;width:100%;max-width:520px;margin:16px auto 0;border-radius:14px;border:1px solid var(--line);
 box-shadow:0 6px 22px -12px rgba(20,73,123,.4);-webkit-touch-callout:default}
.hint{margin-top:16px;font-size:clamp(16px,4.2vw,19px);line-height:1.75;color:var(--sub)}
.hint b{color:var(--navy)}
.hint .soft{display:block;font-size:.88em;opacity:.8}
.acts{display:flex;gap:10px;margin-top:18px}
.acts button{flex:1;font-family:inherit;font-size:clamp(15px,3.9vw,18px);font-weight:800;padding:14px 6px;
 border-radius:14px;border:2px solid var(--navy);background:#fff;color:var(--navy);cursor:pointer}

footer{margin-top:34px;text-align:center}
footer img{width:min(230px,58%);height:auto}
footer p{margin:8px 0 0;font-size:13px;color:#A79683;line-height:1.7;font-family:"Noto Sans KR",system-ui,sans-serif}

#toast{position:fixed;left:50%;bottom:calc(36px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:9;
 background:var(--navy);color:#fff;padding:14px 24px;border-radius:99px;font-size:clamp(16px,4.2vw,19px);font-weight:700;
 width:max-content;max-width:90vw;text-align:center;opacity:0;pointer-events:none;transition:opacity .3s}
#toast.on{opacity:1}
</style></head><body>
<div class="wrap">

  <section class="cover">
    <div class="kicker">2026 엠마오교회</div>
    <h1>가족초청주일</h1>
    <div class="date"><b>11. 15</b><span>주일</span></div>
    <img class="art" src="invite-family.jpg" alt="교회 앞에서 성도들이 새 가족을 두 팔 벌려 맞이하는 그림" width="960" height="960">
  </section>

  <section class="card">
    <p class="lead">함께 오실 분의<br>이름을 적어 주세요</p>

    <div class="pair">
      <label class="field"><span class="lab">공동체</span>
        <input type="text" id="grp" autocomplete="off" enterkeyhint="next"></label>
      <label class="field"><span class="lab">내 이름</span>
        <input type="text" id="nm" autocomplete="off" enterkeyhint="next"></label>
    </div>

    <div class="rule"></div>

    <span class="who-lab">초청할 분 <small>이름</small></span>
    <div id="guests"></div>
    <button type="button" class="more" id="more">+ 한 명 더</button>

    <p class="due"><b>10월 30일(금)</b>까지<br>공동체 리더에게 보내주세요</p>

    <button type="button" class="go" id="make">신청서 만들기</button>

    <div id="result">
      <div class="done">신청서가 만들어졌습니다</div>
      <div id="imgbox"></div>
      <div class="hint">그림을 <b>길게 누르면</b><br>「이미지 저장」이 나타납니다.<br>저장한 그림을 <b>공동체 리더</b>에게 보내주세요.
        <span class="soft">(카톡에서 사진 저장하는 방법과 같습니다)</span></div>
      <div class="acts">
        <button type="button" id="send">카카오톡으로 보내기</button>
        <button type="button" id="copy">글로 복사하기</button>
      </div>
    </div>
  </section>

  <footer>
    <img src="invite-logo.png" alt="엠마오교회 warm Lord's arms" width="613" height="150">
    <p>2026년 11월 15일 주일 · 1부 오전 8:30 · 2부 오전 11:00<br>엠마오교회 본당 · 부산 동래구 안연로 88</p>
  </footer>
</div>

<script>
(function(){
var MAX=10, START=3;
var $=function(id){return document.getElementById(id);};
var guests=$('guests'), more=$('more'), make=$('make'), result=$('result'), imgbox=$('imgbox');
var KEY='emmaus-invite-261115';

function addGuest(val, focus){
  var n=guests.children.length+1; if(n>MAX) return;
  var row=document.createElement('div'); row.className='guest';
  row.innerHTML='<span class="no">'+n+'</span><input type="text" autocomplete="off" enterkeyhint="next" aria-label="초청할 분 '+n+'">';
  var inp=row.querySelector('input'); inp.value=val||'';
  inp.addEventListener('input',changed);
  guests.appendChild(row);
  more.style.display=(guests.children.length>=MAX)?'none':'';
  if(focus) inp.focus();
}
function guestNames(){
  return Array.prototype.map.call(guests.querySelectorAll('input'),function(i){return i.value.trim();})
    .filter(function(v){return v;});
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify({g:$('grp').value, n:$('nm').value,
    list:Array.prototype.map.call(guests.querySelectorAll('input'),function(i){return i.value;})})); }catch(e){}
}
function changed(){
  save();
  if(result.classList.contains('on')) make.textContent='신청서 다시 만들기';
}
function toast(msg){
  var el=$('toast'); if(!el){ el=document.createElement('div'); el.id='toast'; document.body.appendChild(el); }
  el.textContent=msg; el.classList.add('on'); clearTimeout(el._t);
  el._t=setTimeout(function(){ el.classList.remove('on'); },2200);
}

/* 처음 불러오기 (적다가 나갔다 와도 남아 있게) */
var saved=null; try{ saved=JSON.parse(localStorage.getItem(KEY)||'null'); }catch(e){}
if(saved){ $('grp').value=saved.g||''; $('nm').value=saved.n||''; }
var startList=(saved&&saved.list&&saved.list.length)?saved.list:[];
for(var k=0;k<Math.max(START,startList.length);k++) addGuest(startList[k]||'');
$('grp').addEventListener('input',changed); $('nm').addEventListener('input',changed);
more.onclick=function(){ addGuest('',true); save(); };

/* ── 신청서 그림 ── */
var art=new Image(); art.src='invite-family.jpg';
var logo=new Image(); logo.src='invite-logo.png';
function ready(img){ return new Promise(function(r){ if(img.complete&&img.naturalWidth) r(); else { img.onload=r; img.onerror=r; } }); }
function fontsReady(){
  if(!document.fonts||!document.fonts.load) return Promise.resolve();
  var p=Promise.all(['800 60px "Nanum Myeongjo"','700 40px "Nanum Myeongjo"'].map(function(f){return document.fonts.load(f,'가족초청주일');}));
  return Promise.race([p, new Promise(function(r){setTimeout(r,2500);})]);
}
var SERIF='"Nanum Myeongjo","Noto Serif KR","Apple SD Gothic Neo","Malgun Gothic",serif';
function rr(x,X,Y,W,H,R){ x.beginPath(); x.moveTo(X+R,Y); x.arcTo(X+W,Y,X+W,Y+H,R); x.arcTo(X+W,Y+H,X,Y+H,R);
  x.arcTo(X,Y+H,X,Y,R); x.arcTo(X,Y,X+W,Y,R); x.closePath(); }
function fit(x,text,font,size,maxW){ var s=size; do{ x.font=font.replace('{s}',s); if(x.measureText(text).width<=maxW) break; s-=2; }while(s>24); return s; }

function draw(g, nm, list){
  var W=1080, PAD=70, ROW=84;
  var cardH=366+list.length*ROW;
  var H=70+64+96+56+600+cardH-70+60+92+70;
  var c=document.createElement('canvas'); c.width=W; c.height=H; var x=c.getContext('2d');
  x.fillStyle='#FCF2E6'; x.fillRect(0,0,W,H);
  x.textAlign='center'; x.textBaseline='alphabetic';
  var y=70+40;
  x.fillStyle='#B5612A'; x.font='700 34px '+SERIF; x.fillText('2026  엠 마 오 교 회',W/2,y);
  y+=100; x.fillStyle='#14497B'; x.font='800 88px '+SERIF; x.fillText('가족초청주일 신청서',W/2,y);
  y+=66; x.fillStyle='#B5612A'; x.font='800 44px '+SERIF; x.fillText('2026. 11. 15 주일',W/2,y);
  var imgY=y+24, S=600;
  if(art.naturalWidth) x.drawImage(art,(W-S)/2,imgY,S,S);
  /* 카드 */
  var cy=imgY+S-70, cx=PAD, cw=W-PAD*2;
  x.save(); x.shadowColor='rgba(20,73,123,.18)'; x.shadowBlur=30; x.shadowOffsetY=10;
  rr(x,cx,cy,cw,cardH,34); x.fillStyle='#FFFDF9'; x.fill(); x.restore();
  rr(x,cx,cy,cw,cardH,34); x.strokeStyle='#E4D9CC'; x.lineWidth=2; x.stroke();
  x.textAlign='left';
  var lx=cx+56, vx=cx+250, vmax=cx+cw-56-vx, ly=cy+60+40;
  function line(label,val){
    x.fillStyle='#5B5148'; x.font='800 34px '+SERIF; x.fillText(label,lx,ly);
    var s=fit(x,val,'800 {s}px '+SERIF,48,vmax); x.fillStyle='#2E2A26'; x.font='800 '+s+'px '+SERIF; x.fillText(val,vx,ly);
    ly+=96;
  }
  line('공동체', g||'-'); line('이름', nm);
  x.strokeStyle='#E4D9CC'; x.lineWidth=2; x.beginPath(); x.moveTo(lx,ly-56); x.lineTo(cx+cw-56,ly-56); x.stroke();
  ly+=4; x.fillStyle='#14497B'; x.font='800 36px '+SERIF; x.fillText('초청할 분',lx,ly); ly+=70;
  list.forEach(function(name,i){
    x.fillStyle='#9ED6C4'; x.beginPath(); x.arc(lx+24,ly-15,24,0,Math.PI*2); x.fill();
    x.fillStyle='#14497B'; x.textAlign='center'; x.font='800 28px "Noto Sans KR",system-ui,sans-serif'; x.fillText(String(i+1),lx+24,ly-5);
    x.textAlign='left'; var s=fit(x,name,'800 {s}px '+SERIF,46,cx+cw-56-(lx+76));
    x.fillStyle='#2E2A26'; x.font='800 '+s+'px '+SERIF; x.fillText(name,lx+76,ly);
    ly+=ROW;
  });
  /* 로고 */
  if(logo.naturalWidth){ var lw=360, lh=lw*logo.naturalHeight/logo.naturalWidth; x.drawImage(logo,(W-lw)/2,H-70-lh,lw,lh); }
  return c;
}

var blobUrl=null, lastBlob=null, lastName='';
make.onclick=function(){
  var g=$('grp').value.trim(), nm=$('nm').value.trim(), list=guestNames();
  if(!nm){ toast('내 이름을 적어 주세요'); $('nm').focus(); return; }
  if(!list.length){ toast('초청할 분의 이름을 적어 주세요'); guests.querySelector('input').focus(); return; }
  make.disabled=true; make.textContent='만드는 중…';
  Promise.all([ready(art),ready(logo),fontsReady()]).then(function(){
    var c=draw(g,nm,list);
    c.toBlob(function(b){
      lastBlob=b; lastName='가족초청_'+nm+'.png';
      if(blobUrl) URL.revokeObjectURL(blobUrl);
      blobUrl=URL.createObjectURL(b);
      imgbox.innerHTML='<img src="'+blobUrl+'" alt="가족초청주일 신청서 그림">';
      result.classList.add('on');
      make.disabled=false; make.textContent='신청서 다시 만들기';
      setTimeout(function(){ result.scrollIntoView({behavior:'smooth',block:'start'}); },80);
    },'image/png');
  });
};
function asText(){
  var list=guestNames(), L=['가족초청주일 신청서 (2026. 11. 15)',
    '공동체: '+($('grp').value.trim()||'-'), '이름: '+$('nm').value.trim(), '초청할 분:'];
  list.forEach(function(n,i){ L.push('  '+(i+1)+'. '+n); });
  return L.join('\n');
}
$('send').onclick=function(){
  if(!lastBlob) return;
  var file=new File([lastBlob],lastName,{type:'image/png'});
  if(navigator.canShare&&navigator.canShare({files:[file]})){
    navigator.share({files:[file],title:'가족초청주일 신청서'}).catch(function(){});
  }else{ toast('여기서는 바로 보낼 수 없어요. 그림을 길게 눌러 저장해 주세요'); }
};
$('copy').onclick=function(){
  var t=asText();
  if(navigator.clipboard&&window.isSecureContext){ navigator.clipboard.writeText(t).then(function(){toast('복사했습니다. 카톡에 붙여넣으세요');},function(){fallback(t);}); }
  else fallback(t);
};
function fallback(t){
  var ta=document.createElement('textarea'); ta.value=t; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); }catch(e){} ta.remove();
  toast('복사했습니다. 카톡에 붙여넣으세요');
}
})();
</script>
</body></html>
